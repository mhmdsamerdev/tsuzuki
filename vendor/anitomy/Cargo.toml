[package]
name = "tsuzuki-anitomy"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Use this until it gets merged (and released) upstream:
# https://github.com/rust-phf/rust-phf/pull/309
phf = { version = "0.12", features = ["macros", "uncased"] }   # Change made by Tsuzuki: was the edef1c fork
uncased = "0.9.10"
regex = "1"
serde = { version = "1.0.200", features = ["derive"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
tsuzuki-anitomy = { path = ".", features = ["serde"] }
serde = {version = "1", features = ["derive"] }
serde_json = "1"

[features]
serde = ["dep:serde"]
wasm = ["dep:wasm-bindgen"]
