name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Workspace-wide so vendor/anitomy must compile too.
      - name: Build
        run: cargo build --workspace

      # Includes vendor/anitomy's tests. Live-network tests are ignored.
      - name: Test
        run: cargo test --workspace

      - name: Format check
        run: cargo fmt -p tsuzuki --check

      # Skips vendor/anitomy: read-only third-party code.
      - name: Clippy
        run: cargo clippy -p tsuzuki --no-deps --all-targets -- -D warnings
