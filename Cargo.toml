[workspace]
members = [".", "vendor/anitomy"]

[package]
name = "tsuzuki"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
natord = "1.0.9"
serde = { version = "1.0.229", features = ["derive"] }
symphonia = { version = "0.6.1", default-features = false, features = ["mkv", "isomp4"] }
tempfile = "3.27.0"
toml = "1.1.4"
tsuzuki-anitomy = { path = "vendor/anitomy" }
