[workspace]
members = [".", "vendor/anitomy"]

[package]
name = "tsuzuki"
version = "0.2.1"
edition = "2024"
description = "Remembers what you were watching in mpv and resumes it with one command."
license = "GPL-3.0-or-later"
repository = "https://github.com/mhmdsamerdev/tsuzuki"
readme = "README.md"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
console = "0.16"
dirs = "6.0.0"
natord = "1.0.9"
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27.0"
toml = "1.1.4"
tsuzuki-anitomy = { path = "vendor/anitomy", version = "0.1.0" }
# Blocking HTTP client, so no async runtime. rustls with the system CA store.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

# Profile used by cargo-dist builds
[profile.dist]
inherits = "release"
lto = "thin"
