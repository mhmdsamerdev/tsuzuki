[workspace]
members = [".", "vendor/anitomy"]

[package]
name = "tsuzuki"
version = "0.1.1"
edition = "2024"
description = "Remembers what you were watching in mpv and resumes it with one command."
license = "GPL-3.0-or-later"
repository = "https://github.com/mhmdsamerdev/tsuzuki"
readme = "README.md"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dialoguer = "0.12.0"
dirs = "6.0.0"
natord = "1.0.9"
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.6.1", default-features = false, features = ["mkv", "isomp4"] }
tempfile = "3.27.0"
toml = "1.1.4"
tsuzuki-anitomy = { path = "vendor/anitomy", version = "0.1.0" }
# Blocking-only HTTP client for the MAL API (CLAUDE.md §5: "MAL calls must
# stay lazy/on-demand" — no tokio, no async runtime pulled in for one
# on-demand code path). native-tls backend so it actually uses the
# pkg-config+openssl shell.nix already provisions for this, rather than
# pulling in rustls as a second, unused TLS stack.
ureq = { version = "2.10", default-features = false, features = ["native-tls", "gzip"] }
# A direct (not just transitive) dependency: ureq's `native-tls` feature is
# never auto-wired by its own shortcut functions (`ureq::post`, etc.) — only
# `AgentBuilder::tls_connector(...)` picks it up, which means constructing a
# `native_tls::TlsConnector` directly, in `mal.rs`. See `UreqClient`'s doc
# comment for the real, dogfooded failure this fixes.
native-tls = "0.2"
webbrowser = "1.0"
# Forces the openssl-sys dependency native-tls pulls in on Linux to build
# and statically link its own vendored OpenSSL, rather than linking
# against whatever libssl happens to be on the build/install machine.
# Without this, a prebuilt release binary would only run on a system with
# a compatible system OpenSSL already installed — the opposite of a
# `curl | sh` install just working. Cargo unifies this feature across the
# whole dependency graph, so declaring it here is enough.
openssl = { version = "0.10", features = ["vendored"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
