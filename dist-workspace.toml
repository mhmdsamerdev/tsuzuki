[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# dist version used in CI
cargo-dist-version = "0.32.0"
# CI backend
ci = "github"
# Installers to generate
installers = ["shell"]
# Build targets
# Linux only; macOS/Windows mpv-log paths are unverified.
targets = ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
# Where installers place binaries
install-path = "~/.local/bin"
# No bundled updater
install-updater = false
